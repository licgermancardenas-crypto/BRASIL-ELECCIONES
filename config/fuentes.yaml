# config/fuentes.yaml
# Catálogo único de fuentes — toda URL/endpoint usado por el ETL se declara acá,
# nunca hardcodeado dentro de los scripts.

tse:
  cdn:
    # Archivos reales (zip con CSV por UF). El portal dados_abertos de abajo
    # devuelve páginas HTML, no los zips — el extractor descarga desde acá.
    base_url: "https://cdn.tse.jus.br/estatistica/sead/odsele"
    # clave: nombre lógico del dataset en el proyecto
    #   ruta:    plantilla relativa a base_url
    #   carpeta: subcarpeta en data/raw/tse/
    datasets:
      resultados:
        ruta: "votacao_candidato_munzona/votacao_candidato_munzona_{ano}.zip"
        carpeta: "resultados"
      resultados_partido:
        ruta: "votacao_partido_munzona/votacao_partido_munzona_{ano}.zip"
        carpeta: "resultados_partido"
      detalle_votacion:
        # comparecencia, abstención, blancos y nulos por município/zona
        ruta: "detalhe_votacao_munzona/detalhe_votacao_munzona_{ano}.zip"
        carpeta: "detalle_votacion"
      candidatos:
        ruta: "consulta_cand/consulta_cand_{ano}.zip"
        carpeta: "candidaturas"
      coligaciones:
        ruta: "consulta_coligacao/consulta_coligacao_{ano}.zip"
        carpeta: "coligaciones"
      vagas:
        # Bancas en disputa por cargo y UF (Câmara, Senado, asambleas)
        ruta: "consulta_vagas/consulta_vagas_{ano}.zip"
        carpeta: "vagas"
      votacion_seccion_presidente:
        # Votos por seção eleitoral, solo PRESIDENTE, todo el país (archivo
        # "_BR"). Los archivos por UF traen todos los cargos (SP: 900 MB).
        ruta: "votacao_secao/votacao_secao_{ano}_BR.zip"
        carpeta: "votacion_seccion"
      locales_votacion:
        # Locais de votação con dirección y coordenadas (lat/long) y sus
        # seções: es lo que permite ubicar cada sección en el mapa.
        ruta: "eleitorado_locais_votacao/eleitorado_local_votacao_{ano}.zip"
        carpeta: "locales_votacion"
      padron:
        ruta: "perfil_eleitorado/perfil_eleitorado_{ano}.zip"
        carpeta: "padron"
      encuestas_registradas:
        # Ficha técnica de cada encuesta registrada (PesqEle). NO trae resultados.
        ruta: "pesquisa_eleitoral/pesquisa_eleitoral_{ano}.zip"
        carpeta: "encuestas_registradas"

  dados_abertos:
    # Portal (HTML) — referencia humana, no se descarga desde acá.
    base_url: "https://dadosabertos.tse.jus.br"
    datasets:
      candidatos: "dataset/candidatos-{ano}"
      resultados: "dataset/resultados-{ano}"
      padron: "dataset/eleitorado-{ano}"
      prestacao_contas: "dataset/prestacao-de-contas-eleitorais-{ano}"
      bens_candidatos: "dataset/bem-candidato-{ano}"
  resultados_tempo_real:
    # API de totalización por seção eleitoral — máximo nivel de detalle electoral
    base_url: "https://resultados.tse.jus.br/oficial"
    pattern: "ele{ano}/arquivo-urna/{turno}/dados/{uf}/{municipio}/{zona}/{secao}/{hash}/o00{turno}-{municipio}{zona}{secao}.rdv"
  divulgacand:
    base_url: "https://divulgacandcontas.tse.jus.br"
  encuestas_registradas:
    # Fichas técnicas de encuestas registradas obligatoriamente ante el TSE
    base_url: "https://www.tse.jus.br/eleicoes/pesquisas-eleitorais"

cepesp:
  # Datos TSE ya limpiados y agregados (Brasil / UF / município / microrregião)
  rest_api: "http://electionsBR.cepesp.io/api/consulta"
  github_repo: "https://github.com/Cepesp-Fgv/tse-dados"

ibge:
  malhas_territoriais:
    base_url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais"
    setores_censitarios: "malha_de_setores_censitarios/censo_2022"
    municipios: "malha_municipal"
    epsg: 4674  # SIRGAS 2000
  censo_2022_setores:
    # Censo 2022, agregados por setor censitário (todo Brasil) y malla de
    # setores en GeoPackage (EPSG:4674). Insumo del análisis por sección.
    base_url: "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios"
    archivos:
      malla_setores: "malha_com_atributos/setores/gpkg/BR/BR_setores_CD2022.gpkg"
      basico: "Agregados_por_Setor_csv/Agregados_por_setores_basico_BR_20260520.zip"
      alfabetizacion: "Agregados_por_Setor_csv/Agregados_por_setores_alfabetizacao_BR.zip"
      demografia: "Agregados_por_Setor_csv/Agregados_por_setores_demografia_BR.zip"
      color_raza: "Agregados_por_Setor_csv/Agregados_por_setores_cor_ou_raca_BR.zip"
      domicilio1: "Agregados_por_Setor_csv/Agregados_por_setores_caracteristicas_domicilio1_BR.zip"
      domicilio2: "Agregados_por_Setor_csv/Agregados_por_setores_caracteristicas_domicilio2_BR_20250417.zip"
      diccionario: "dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx"
    # Misma malla partida por UF (27 archivos chicos): se usa esta para no
    # cargar 1,5 GB de una vez (el 2026-10-02 la descarga nacional se cortó por memoria).
    malla_setores_uf: "malha_com_atributos/setores/gpkg/UF/{uf}/{uf}_setores_CD2022.gpkg"
    ufs: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
  localidades_api:
    # Lista oficial de municípios con código IBGE (7 dígitos) y jerarquía
    # regional. Fuente primaria para la tabla de correspondencia TSE↔IBGE.
    municipios: "https://servicodados.ibge.gov.br/api/v1/localidades/municipios?view=nivelado"
  sidra_api:
    # API tabular del IBGE (censo, PIB municipal, população)
    base_url: "https://servicodados.ibge.gov.br/api/v3"
  atlas_desenvolvimento_humano:
    base_url: "http://www.atlasbrasil.org.br/acervo/atlas"

referencia_comunitaria:
  # Fuentes NO oficiales, usadas solo para validar cruces construidos por
  # el proyecto — nunca como fuente única.
  tse_ibge_betafcc:
    url: "https://raw.githubusercontent.com/betafcc/Municipios-Brasileiros-TSE/master/municipios_brasileiros_tse.csv"
    repo: "https://github.com/betafcc/Municipios-Brasileiros-TSE"

legislativo:
  camara_dados_abertos:
    base_url: "https://dadosabertos.camara.leg.br/api/v2"
    recursos: [deputados, votacoes, blocos, partidos, proposicoes]
  senado_dados_abertos:
    base_url: "https://legis.senado.leg.br/dadosabertos"
    recursos: [senadores, votacoes, blocos, partidos]
    # Senadores en ejercicio hoy, con partido actual y legislaturas del mandato
    senadores_en_ejercicio: "https://legis.senado.leg.br/dadosabertos/senador/lista/atual"

wikipedia:
  # Resultados publicados de encuestas presidenciales (PesqEle no trae %).
  # Fuente secundaria (compilación comunitaria): se guarda el HTML renderizado
  # de una revisión concreta (revid en el manifest) para que el dato sea
  # reproducible aunque la página cambie. Decisión del 2026-10-01.
  api: "https://en.wikipedia.org/w/api.php"
  user_agent: "ATLAS-Brasil-2026/0.1 (investigacion electoral; contacto via repo)"
  paginas_encuestas_presidenciales:
    2018: "Opinion polling for the 2018 Brazilian presidential election"
    2022: "Opinion polling for the 2022 Brazilian presidential election"
    2026: "Opinion polling for the 2026 Brazilian presidential election"

encuestadoras_referencia:
  # Para scraping/registro manual de series históricas publicadas en prensa
  - datafolha
  - quaest
  - nexus_btg
  - atlasintel
  - paranapesquisas
  - genial_quaest
  - ipec
