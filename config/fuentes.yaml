# config/fuentes.yaml
# Catálogo único de fuentes — toda URL/endpoint usado por el ETL se declara acá,
# nunca hardcodeado dentro de los scripts.

tse:
  cdn:
    # Archivos reales (zip con CSV por UF). El portal dados_abertos de abajo
    # devuelve páginas HTML, no los zips — el extractor descarga desde acá.
    base_url: "https://cdn.tse.jus.br/estatistica/sead/odsele"
    # clave: nombre lógico del dataset en el proyecto
    #   ruta:    plantilla relativa a base_url
    #   carpeta: subcarpeta en data/raw/tse/
    datasets:
      resultados:
        ruta: "votacao_candidato_munzona/votacao_candidato_munzona_{ano}.zip"
        carpeta: "resultados"
      resultados_partido:
        ruta: "votacao_partido_munzona/votacao_partido_munzona_{ano}.zip"
        carpeta: "resultados_partido"
      detalle_votacion:
        # comparecencia, abstención, blancos y nulos por município/zona
        ruta: "detalhe_votacao_munzona/detalhe_votacao_munzona_{ano}.zip"
        carpeta: "detalle_votacion"
      candidatos:
        ruta: "consulta_cand/consulta_cand_{ano}.zip"
        carpeta: "candidaturas"
      coligaciones:
        ruta: "consulta_coligacao/consulta_coligacao_{ano}.zip"
        carpeta: "coligaciones"
      padron:
        ruta: "perfil_eleitorado/perfil_eleitorado_{ano}.zip"
        carpeta: "padron"
      encuestas_registradas:
        # Ficha técnica de cada encuesta registrada (PesqEle). NO trae resultados.
        ruta: "pesquisa_eleitoral/pesquisa_eleitoral_{ano}.zip"
        carpeta: "encuestas_registradas"

  dados_abertos:
    # Portal (HTML) — referencia humana, no se descarga desde acá.
    base_url: "https://dadosabertos.tse.jus.br"
    datasets:
      candidatos: "dataset/candidatos-{ano}"
      resultados: "dataset/resultados-{ano}"
      padron: "dataset/eleitorado-{ano}"
      prestacao_contas: "dataset/prestacao-de-contas-eleitorais-{ano}"
      bens_candidatos: "dataset/bem-candidato-{ano}"
  resultados_tempo_real:
    # API de totalización por seção eleitoral — máximo nivel de detalle electoral
    base_url: "https://resultados.tse.jus.br/oficial"
    pattern: "ele{ano}/arquivo-urna/{turno}/dados/{uf}/{municipio}/{zona}/{secao}/{hash}/o00{turno}-{municipio}{zona}{secao}.rdv"
  divulgacand:
    base_url: "https://divulgacandcontas.tse.jus.br"
  encuestas_registradas:
    # Fichas técnicas de encuestas registradas obligatoriamente ante el TSE
    base_url: "https://www.tse.jus.br/eleicoes/pesquisas-eleitorais"

cepesp:
  # Datos TSE ya limpiados y agregados (Brasil / UF / município / microrregião)
  rest_api: "http://electionsBR.cepesp.io/api/consulta"
  github_repo: "https://github.com/Cepesp-Fgv/tse-dados"

ibge:
  malhas_territoriais:
    base_url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais"
    setores_censitarios: "malha_de_setores_censitarios/censo_2022"
    municipios: "malha_municipal"
    epsg: 4674  # SIRGAS 2000
  sidra_api:
    # API tabular del IBGE (censo, PIB municipal, população)
    base_url: "https://servicodados.ibge.gov.br/api/v3"
  atlas_desenvolvimento_humano:
    base_url: "http://www.atlasbrasil.org.br/acervo/atlas"

legislativo:
  camara_dados_abertos:
    base_url: "https://dadosabertos.camara.leg.br/api/v2"
    recursos: [deputados, votacoes, blocos, partidos, proposicoes]
  senado_dados_abertos:
    base_url: "https://legis.senado.leg.br/dadosabertos"
    recursos: [senadores, votacoes, blocos, partidos]

encuestadoras_referencia:
  # Para scraping/registro manual de series históricas publicadas en prensa
  - datafolha
  - quaest
  - nexus_btg
  - atlasintel
  - paranapesquisas
  - genial_quaest
  - ipec
