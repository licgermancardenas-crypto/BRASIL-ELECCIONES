# config/encuestas_segmentos_2026.yaml
# Intención de voto de 2ª vuelta por sexo y edad, tal como la publicaron las
# encuestadoras o la prensa (votos totales, en %, salvo que diga "validos").
# Se cargan a mano desde las fuentes citadas (15/10/2026); un null es un dato que la
# fuente no publicó. Se usan como CONTROL, igual que las encuestas generales
# (decisión del 2026-10-07): el pronóstico no las usa.
